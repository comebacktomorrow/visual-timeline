services:
  # Compiles the plugin into dist/ when it isn't built yet, so `docker compose
  # up` works from a fresh clone (the catalog's reviewers, new contributors).
  # With dist/ already there (npm run build or npm run dev, or CI's build
  # artifact) it does nothing.
  build-plugin:
    # node 24 bundles npm 11; npm 10 rejects this repo's lockfile
    # (docs/UPSTREAM-UPDATES.md)
    image: node:24
    working_dir: /app
    volumes:
      - .:/app
      # keep the container's Linux node_modules out of the host checkout
      - /app/node_modules
    command: sh -c "[ -f dist/module.js ] || (npm ci --no-audit --no-fund && npm run build)"

  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    environment:
      # The plugin is an app with nested plugins, and Grafana checks the
      # signature of each one under its own id (the scaffold's base file
      # names only the root id). Development mode already admits unsigned
      # plugins; listing all three keeps them loading if that ever changes.
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: savvycocoa1919-visualtimeline-app,savvycocoa1919-visualtimeline-panel,savvycocoa1919-visualtimeline-datasource
    depends_on:
      build-plugin:
        condition: service_completed_successfully
      vt-folder:
        condition: service_started
      vt-postgres:
        condition: service_started
      vt-loki-seed:
        condition: service_completed_successfully

  # The HTTP folder fixture (#125): seeded frames with nginx's JSON and HTML
  # listings, for the provisioned "Visual Timeline (folder, …)" data sources
  # and e2e. Grafana lists it as http://vt-folder; browsers load its images
  # from port 8098.
  vt-folder:
    image: nginx:1.27-alpine
    ports:
      - '8098:80'
    volumes:
      - ./tests/folder-fixture/frames:/srv/frames:ro
      - ./tests/folder-fixture/video:/srv/video:ro
      - ./tests/folder-fixture/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Existing data sources holding the same frames (M5): rows in PostgreSQL and
  # log lines in Loki, each pointing at the folder's images above. Generated
  # with the folder by tests/folder-fixture/generate.mjs. Throwaway test
  # credentials; nothing is published.
  vt-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: grafana
      POSTGRES_DB: frames
    volumes:
      - ./tests/folder-fixture/postgres.sql:/docker-entrypoint-initdb.d/frames.sql:ro

  vt-loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/local.yaml
    volumes:
      - ./tests/folder-fixture/loki.yaml:/etc/loki/local.yaml:ro

  # pushes the fixture's log lines, as the last half hour's, once Loki is
  # ready (tests/folder-fixture/seed-loki.mjs), then exits
  vt-loki-seed:
    image: node:24-alpine
    depends_on:
      - vt-loki
    volumes:
      - ./tests/folder-fixture:/fixture:ro
    command: node /fixture/seed-loki.mjs
