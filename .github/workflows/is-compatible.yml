name: Latest Grafana API compatibility check
on: [pull_request]

jobs:
  compatibilitycheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The plugin is an app with nested plugins, so there is one module per
    # plugin; the action checks one module (and reads the plugin.json next
    # to it). `find` used to pick "the" module.ts and would now print three.
    strategy:
      fail-fast: false
      matrix:
        module:
          - ./src/module.tsx
          - ./src/panel/module.ts
    name: compatibilitycheck (${{ matrix.module }})
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # Same reason as ci.yml: Dependabot builds lockfiles with npm 11, which
      # prunes nested entries node 22's bundled npm 10 still demands, so `npm ci`
      # here rejects every Dependabot lockfile. This job was missed when ci.yml
      # was fixed, which left compatibilitycheck red on PRs whose build was green.
      - name: Use npm 11 (matches the npm Dependabot builds lockfiles with)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Compatibility check
        uses: grafana/plugin-actions/is-compatible@is-compatible/v1.0.4
        with:
          module: ${{ matrix.module }}
          comment-pr: 'no'
          fail-if-incompatible: 'yes'
