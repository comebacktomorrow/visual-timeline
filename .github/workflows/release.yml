# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
      # build provenance: GitHub's OIDC token signs an attestation for the zip
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: grafana/plugin-actions/build-plugin@build-plugin/v1.2.1
        with:
          # a verifiable record that this workflow built the zip (the catalog
          # validator checks for it); needs no Grafana token
          attestation: true
          # Signing waits for the catalog review: a public plugin gets its
          # signature level on approval (docs/SUBMISSION.md, "After approval").
          # Then save the token as the GRAFANA_ACCESS_POLICY_TOKEN secret and add:
          # policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          # (https://grafana.com/developers/plugin-tools/publish-a-plugin/sign-a-plugin#generate-an-access-policy-token)
