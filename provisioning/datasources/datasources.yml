apiVersion: 1

datasources:
  - name: TestData DB
    type: testdata
    uid: trlxrdZVk
    isDefault: true

  # Demo data: panels on it draw the built-in demo hosts and frames; the
  # panel smoke tests and the default dashboard use it.
  - name: Visual Timeline (demo)
    type: savvycocoa1919-visualtimeline-datasource
    uid: vt-demo
    access: proxy
    editable: true
    jsonData:
      demo: true

  # HTTP folders (#125): the seeded fixture that docker-compose.yaml serves
  # with nginx, once with each listing format. Grafana lists it on the compose
  # network; browsers load the images from the published port.
  - name: Visual Timeline (folder, HTML)
    type: savvycocoa1919-visualtimeline-datasource
    uid: vt-folder-html
    access: proxy
    editable: true
    jsonData:
      connection: folder
      folderUrl: http://vt-folder/html
      imageUrl: http://localhost:8098/html
      listing: html
      template: '{host}/{YYYY}-{MM}-{DD}/{HH}{mm}{ss}_{variant}.svg'
      smallVariant: lo
      largeVariant: hi

  - name: Visual Timeline (folder, JSON)
    type: savvycocoa1919-visualtimeline-datasource
    uid: vt-folder-json
    access: proxy
    editable: true
    jsonData:
      connection: folder
      folderUrl: http://vt-folder/json
      imageUrl: http://localhost:8098/json
      listing: json
      template: '{host}/{YYYY}-{MM}-{DD}/{HH}{mm}{ss}_{variant}.svg'
      smallVariant: lo
      largeVariant: hi

  # The same folder with a promise (M9): every host a frame every 3 minutes,
  # so cam-b's missing frames are offline.
  - name: Visual Timeline (folder, expected)
    type: savvycocoa1919-visualtimeline-datasource
    uid: vt-folder-expected
    access: proxy
    editable: true
    jsonData:
      connection: folder
      folderUrl: http://vt-folder/html
      imageUrl: http://localhost:8098/html
      listing: html
      template: '{host}/{YYYY}-{MM}-{DD}/{HH}{mm}{ss}_{variant}.svg'
      smallVariant: lo
      largeVariant: hi
      expectedEvery: 3m

  # Existing data sources holding the same frames (M5): see docker-compose.yaml.
  # Throwaway test credentials for a database that holds only the fixture.
  - name: PostgreSQL (frames)
    type: grafana-postgresql-datasource
    uid: vt-postgres
    url: vt-postgres:5432
    user: grafana
    jsonData:
      database: frames
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: grafana

  - name: Loki (frames)
    type: loki
    uid: vt-loki
    url: http://vt-loki:3100
