apiVersion: 1
# Live public feeds for the demo's Rivers and Sun dashboards (#125, M6c):
# real images and measurements, no infrastructure, read straight from the
# agencies' servers. Public domain or free to use with credit (the dashboards
# carry it). Never used in CI: these servers can change or be slow.
datasources:
  # USGS river cameras: a public S3 bucket, listed through the HTTP folder
  # connection. Hosts are the cameras' folders; "thumbnail" for the strips,
  # "720" for the preview.
  - name: USGS river cameras
    type: savvycocoa1919-visualtimeline-datasource
    uid: vt-usgs-cameras
    access: proxy
    editable: true
    jsonData:
      connection: folder
      folderUrl: https://usgs-nims-images.s3.amazonaws.com
      listing: s3
      template: '{variant}/{host}/{host}___{YYYY}-{MM}-{DD}T{HH}-{mm}-{ss}Z.jpg'
      smallVariant: thumbnail
      largeVariant: '720'

  # NASA SDO: the Sun, a folder per day with an HTML listing; the channel and
  # the image size are in each file's name.
  - name: NASA SDO
    type: savvycocoa1919-visualtimeline-datasource
    uid: vt-nasa-sdo
    access: proxy
    editable: true
    jsonData:
      connection: folder
      folderUrl: https://sdo.gsfc.nasa.gov/assets/img/browse
      listing: html
      template: '{YYYY}/{MM}/{DD}/{YYYY}{MM}{DD}_{HH}{mm}{ss}_{variant}_{host}.jpg'
      smallVariant: '512'
      largeVariant: '2048'

  # Infinity, for the measurements beside the images: USGS water levels and
  # camera records, NOAA SWPC's X-ray flux and flares. Public APIs, no keys.
  - name: Public APIs
    type: yesoreyeram-infinity-datasource
    uid: vt-public-api
    access: proxy
    editable: true
