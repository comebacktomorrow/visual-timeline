# The HTTP folder fixture (#125), served twice: with nginx's JSON listing and
# with its default HTML one. Grafana's proxy lists it as http://vt-folder/…;
# browsers load its images from the published port. It serves the test
# video clips too.
server {
  listen 80;
  location /json/ { alias /srv/frames/; autoindex on; autoindex_format json; }
  location /html/ { alias /srv/frames/; autoindex on; }
  # video clips (M10c): small VP9 WebM, which every browser Playwright drives plays
  location /video/ { alias /srv/video/; }
}
