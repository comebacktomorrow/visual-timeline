<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Timeline</title>
<style>
  :root {
    --bg: #181b1f; --bg2: #22262b; --border: #2c3235;
    --text: #ccccdc; --dim: #7b8087;
    --accent: #f2cc0c; --live: #73bf69;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 12px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .topbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 12px; border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  .brand { font-weight: 700; font-size: 13px; letter-spacing: .3px; }
  .brand .dot { color: var(--accent); }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .chip {
    padding: 2px 9px; border-radius: 10px; cursor: pointer; user-select: none;
    background: var(--bg2); border: 1px solid var(--border); color: var(--dim);
  }
  .chip.on { color: #111; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .seg button {
    background: var(--bg2); color: var(--dim); border: 0; padding: 3px 10px;
    cursor: pointer; font: inherit;
  }
  .seg button.on { background: var(--accent); color: #111; font-weight: 600; }
  .icobtn {
    background: var(--bg2); color: var(--dim); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 8px; cursor: pointer; font: inherit;
  }
  .icobtn:hover { color: var(--text); }
  .spacer { flex: 1; }
  .cursor-time { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); min-width: 62px; }
  .live-badge { display: none; padding: 1px 7px; border-radius: 3px; background: var(--live); color: #111; font-weight: 700; }
  body.is-live .live-badge { display: inline-block; }
  .win { color: var(--dim); font-variant-numeric: tabular-nums; }
  .note { color: var(--dim); font-size: 11px; }

  /* time picker (Grafana-style range menu) */
  .tp { position: relative; }
  .tp-btn {
    display: flex; align-items: center; gap: 6px;
    background: var(--bg2); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 10px; cursor: pointer; font: inherit;
    font-variant-numeric: tabular-nums;
  }
  .tp-btn .caret { color: var(--dim); font-size: 9px; }
  .tp-pane[hidden] { display: none; }
  .tp-pane {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 1000;
    display: flex; background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.5);
    max-width: calc(100vw - 24px);
  }
  .tp-abs {
    padding: 12px; display: flex; flex-direction: column; gap: 6px;
    border-right: 1px solid var(--border); min-width: 250px;
  }
  .tp h4 { font-size: 12px; font-weight: 600; }
  .tp label { color: var(--dim); font-size: 11px; }
  .tp-row { position: relative; display: flex; gap: 4px; }
  .tp-row input:not(.tp-cal) {
    flex: 1; min-width: 0; background: var(--bg2); border: 1px solid var(--border);
    color: var(--text); border-radius: 3px; padding: 4px 6px; font: inherit;
    font-variant-numeric: tabular-nums;
  }
  .tp-row input.bad { border-color: #e0684b; }
  .tp-cal { position: absolute; bottom: 0; right: 0; opacity: 0; pointer-events: none; width: 1px; height: 1px; border: 0; }
  #tpApply {
    margin-top: 6px; background: var(--accent); color: #111; font-weight: 600;
    border: 0; border-radius: 3px; padding: 5px 8px; cursor: pointer; font: inherit;
  }
  .tp-recent { margin-top: 8px; display: flex; flex-direction: column; gap: 2px; }
  .tp-recent .rr {
    color: var(--dim); cursor: pointer; padding: 2px 4px; border-radius: 3px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .tp-recent .rr:hover { background: var(--bg2); color: var(--text); }
  .tp-quick { max-height: 320px; overflow-y: auto; padding: 8px 0; min-width: 150px; }
  .tp-quick h4 { padding: 2px 14px 6px; }
  .tp-quick .qr { padding: 4px 14px; cursor: pointer; white-space: nowrap; }
  .tp-quick .qr:hover { background: var(--bg2); }
  .tp-quick .qr.on { color: var(--accent); font-weight: 600; }

  .panels { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 8px 12px; }
  .panel { min-height: 0; display: flex; flex-direction: column; }
  body[data-mode="both"] .panel.timeline { flex: 3 1 0; }
  body[data-mode="both"] .panel.grid-panel { flex: 2 1 0; }
  body[data-mode="timeline"] .panel.grid-panel { display: none; }
  body[data-mode="timeline"] .panel.timeline { flex: 1 1 auto; }
  body[data-mode="grid"] .panel.timeline { display: none; }
  body[data-mode="grid"] .panel.grid-panel { flex: 1 1 auto; }
</style>
</head>
<body data-mode="both">
  <div class="topbar">
    <span class="brand">Visual<span class="dot">·</span>Timeline</span>
    <nav class="chips" id="siteChips" title="site filter"></nav>
    <div class="seg" id="modeSeg">
      <button data-mode="timeline">Timeline</button>
      <button data-mode="both">Both</button>
      <button data-mode="grid">Grid</button>
    </div>
    <div class="seg" id="fitSeg">
      <button data-fit="fit">Fit</button>
      <button data-fit="fill">Fill</button>
    </div>
    <span class="note">drag a strip to zoom</span>
    <span class="spacer"></span>
    <button class="icobtn" id="tpBack" title="shift window back">‹</button>
    <div class="tp" id="tp">
      <button class="tp-btn" id="tpBtn" title="time range"><span id="tpLabel"></span><span class="caret">▾</span></button>
      <div class="tp-pane" id="tpPane" hidden>
        <div class="tp-abs">
          <h4>Absolute time range</h4>
          <label for="tpFrom">From</label>
          <div class="tp-row">
            <input id="tpFrom" spellcheck="false" placeholder="now-1h or 2026-08-21 09:00">
            <button class="icobtn" id="tpFromBtn" title="pick date">📅</button>
            <input type="datetime-local" id="tpFromCal" class="tp-cal" tabindex="-1">
          </div>
          <label for="tpTo">To</label>
          <div class="tp-row">
            <input id="tpTo" spellcheck="false" placeholder="now">
            <button class="icobtn" id="tpToBtn" title="pick date">📅</button>
            <input type="datetime-local" id="tpToCal" class="tp-cal" tabindex="-1">
          </div>
          <button id="tpApply">Apply time range</button>
          <div class="tp-recent" id="tpRecent"></div>
        </div>
        <div class="tp-quick" id="tpQuick"></div>
      </div>
    </div>
    <button class="icobtn" id="tpFwd" title="shift window forward">›</button>
    <button class="icobtn" id="tpOut" title="zoom out">−</button>
    <span class="cursor-time" id="cursorTime"></span>
    <span class="live-badge">LIVE</span>
    <span class="win" id="winLabel"></span>
  </div>
  <div class="panels">
    <div class="panel timeline"><div id="timelineMount" style="flex:1;min-height:0"></div></div>
    <div class="panel grid-panel"><div id="gridMount" style="flex:1;min-height:0"></div></div>
  </div>

<script src="vt-core.js"></script>
<script>
'use strict';
/* Visual Timeline — standalone app. All rendering lives in the shared core
 * (vt-core.js, built from src/core.ts — the same code the Grafana panel
 * runs). This file is only chrome and glue: URL state, site chips, mode and
 * fit toggles, the time-range picker, and the within-page
 * cursor sync that stands in for Grafana's shared crosshair. */

const qs = new URLSearchParams(location.search);
const NOW = Date.now();

/* ---------------- URL state (accepts Grafana dashboard-link params) ------- */
function parseVar(v) {
  if (!v || v === 'All' || v === '$__all') return null;
  return v.replace(/^\{|\}$/g, '').split(',').map(s => s.trim()).filter(Boolean);
}
function parseVarMulti(direct, linkVals) {
  if (direct) return parseVar(direct);
  if (!linkVals.length) return null;
  const out = [];
  for (const v of linkVals) {
    const p = parseVar(v);
    if (p === null) return null;
    out.push(...p);
  }
  return out.length ? out : null;
}
function parseTimeParam(v, def) {
  if (!v) return def;
  if (/^\d+$/.test(v)) return Number(v);
  const m = /^now(?:-(\d+)([smhdw]))?$/.exec(v);
  if (m) {
    const mult = { s: 1e3, m: 60e3, h: 3600e3, d: 864e5, w: 6048e5 };
    return NOW - (m[1] ? Number(m[1]) * mult[m[2]] : 0);
  }
  return def;
}
const P = {
  site:  parseVarMulti(qs.get('site'), qs.getAll('var-site')),
  from:  parseTimeParam(qs.get('from'), NOW - 3600e3),
  to:    parseTimeParam(qs.get('to'), NOW),
  mode:  ['timeline', 'grid', 'both'].includes(qs.get('mode')) ? qs.get('mode') : 'both',
  fit:   qs.get('fit') === 'fill' ? 'fill' : 'fit',
  key:   qs.get('k') || '',
  tags:  qs.get('tags') || '',
  hideEmpty: qs.get('hideEmpty') === '1',
  annLanes: qs.get('annLanes') === 'per-source' ? 'per-source' : 'shared',
  header: ['inline', 'inline-gradient'].includes(qs.get('header')) ? qs.get('header') : 'bar',
};
/* raw from/to as written in the URL — relative expressions (now-6h) stay
 * relative so shared links re-evaluate on open; absent params default to
 * a live last-hour window */
const RAW = { from: qs.get('from') || 'now-1h', to: qs.get('to') || 'now' };
const SPAN = Math.max(1, P.to - P.from);
const LIVE = P.to > NOW - 2 * 60 * 1000;

function navigate(updates) {
  const u = new URL(location.href);
  for (const [k, v] of Object.entries(updates)) {
    if (v === null || v === undefined || v === '') u.searchParams.delete(k);
    else u.searchParams.set(k, v);
  }
  u.searchParams.delete('var-site');
  location.href = u;
}

const fmtTime = ts => new Date(ts).toLocaleTimeString('en-AU', { hour12: false });
const fmtShort = ts => new Date(ts).toLocaleTimeString('en-AU', { hour12: false, hour: '2-digit', minute: '2-digit' });
const pad2 = n => String(n).padStart(2, '0');
const fmtAbs = ts => { const d = new Date(ts); return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const toLocalDT = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };

const AUTHH = P.key ? { headers: { authorization: 'Bearer ' + P.key } } : undefined;
async function probeApi() {
  if (qs.get('backend') === 'mock') return false;
  try {
    const r = await fetch(new URL('/sources', location.origin), AUTHH);
    return r.ok;
  } catch { return false; }
}

/* ---------------- time picker (Grafana-style range menu) ------------------ */
const UNIT_WORD = { s: 'second', m: 'minute', h: 'hour', d: 'day', w: 'week' };
function rangeLabel() {
  const m = /^now-(\d+)([smhdw])$/.exec(RAW.from);
  if (m && RAW.to === 'now') {
    const n = Number(m[1]);
    return `Last ${n} ${UNIT_WORD[m[2]]}${n > 1 ? 's' : ''}`;
  }
  return `${fmtAbs(P.from)} → ${fmtAbs(P.to)}`;
}
/* lenient input parse: now / now-6h / epoch ms / local "YYYY-MM-DD HH:mm";
 * returns the URL-safe form plus its resolved ms, or null when invalid */
function parseInput(s) {
  s = s.trim();
  if (!s) return null;
  if (/^now/.test(s)) { const ms = parseTimeParam(s, null); return ms == null ? null : { url: s, ms }; }
  if (/^\d+$/.test(s)) return { url: s, ms: Number(s) };
  const d = new Date(s.replace(' ', 'T'));
  return isNaN(d) ? null : { url: String(d.getTime()), ms: d.getTime() };
}
const TP_QUICK = [
  ['Last 5 minutes', '5m'], ['Last 15 minutes', '15m'], ['Last 30 minutes', '30m'],
  ['Last 1 hour', '1h'], ['Last 3 hours', '3h'], ['Last 6 hours', '6h'],
  ['Last 12 hours', '12h'], ['Last 24 hours', '24h'], ['Last 2 days', '2d'],
  ['Last 7 days', '7d'], ['Last 30 days', '30d'],
];
(function timePicker() {
  const $ = id => document.getElementById(id);
  const pane = $('tpPane');
  $('tpLabel').textContent = rangeLabel();

  $('tpQuick').innerHTML = '<h4>Quick ranges</h4>' + TP_QUICK.map(([label, k]) =>
    `<div class="qr ${RAW.to === 'now' && RAW.from === 'now-' + k ? 'on' : ''}" data-r="${k}">${label}</div>`).join('') +
    '<div class="qr" data-special="today">Today so far</div>' +
    '<div class="qr" data-special="yesterday">Yesterday</div>';
  $('tpQuick').addEventListener('click', e => {
    const r = e.target.dataset.r, sp = e.target.dataset.special;
    if (r) return navigate({ from: 'now-' + r, to: null });
    if (sp === 'today') {
      const d = new Date(); d.setHours(0, 0, 0, 0);
      return navigate({ from: d.getTime(), to: null });
    }
    if (sp === 'yesterday') {
      const t0 = new Date(); t0.setHours(0, 0, 0, 0);
      const y0 = new Date(t0); y0.setDate(y0.getDate() - 1);
      return navigate({ from: y0.getTime(), to: t0.getTime() });
    }
  });

  const RKEY = 'vt.recentRanges';
  const loadRecents = () => { try { return JSON.parse(localStorage.getItem(RKEY)) || []; } catch { return []; } };
  const fmtRaw = v => /^\d+$/.test(v) ? fmtAbs(Number(v)) : v;
  function renderRecents() {
    const rs = loadRecents();
    $('tpRecent').innerHTML = rs.length
      ? '<label>Recently used</label>' + rs.map(([f, t], i) =>
          `<span class="rr" data-i="${i}">${fmtRaw(f)} → ${fmtRaw(t)}</span>`).join('')
      : '';
  }
  $('tpRecent').addEventListener('click', e => {
    const i = e.target.dataset.i;
    if (i == null) return;
    const r = loadRecents()[Number(i)];
    if (r) navigate({ from: r[0], to: r[1] === 'now' ? null : r[1] });
  });

  let open = false;
  function setOpen(v) {
    open = v;
    pane.hidden = !v;
    if (!v) return;
    $('tpFrom').value = /^\d+$/.test(RAW.from) ? toLocalDT(P.from).replace('T', ' ') : RAW.from;
    $('tpTo').value = /^\d+$/.test(RAW.to) ? toLocalDT(P.to).replace('T', ' ') : RAW.to;
    $('tpFrom').classList.remove('bad');
    $('tpTo').classList.remove('bad');
    renderRecents();
  }
  $('tpBtn').onclick = e => { e.stopPropagation(); setOpen(!open); };
  document.addEventListener('click', e => { if (open && !$('tp').contains(e.target)) setOpen(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setOpen(false); });

  function wireCal(textId, calId, btnId) {
    const t = $(textId), c = $(calId);
    $(btnId).onclick = () => {
      const v = parseInput(t.value);
      c.value = toLocalDT(v ? v.ms : Date.now());
      if (c.showPicker) c.showPicker();
    };
    c.onchange = () => { t.value = c.value.replace('T', ' '); t.classList.remove('bad'); };
  }
  wireCal('tpFrom', 'tpFromCal', 'tpFromBtn');
  wireCal('tpTo', 'tpToCal', 'tpToBtn');

  function apply() {
    const f = parseInput($('tpFrom').value), t = parseInput($('tpTo').value);
    const orderBad = f && t && t.ms - f.ms <= 0;
    $('tpFrom').classList.toggle('bad', !f);
    $('tpTo').classList.toggle('bad', !t || orderBad);
    if (!f || !t || orderBad) return;
    if (!(t.url === 'now' && /^now-\d+[smhdw]$/.test(f.url))) {   // quick picks live in the list already
      const rs = loadRecents().filter(([a, b]) => !(a === f.url && b === t.url));
      rs.unshift([f.url, t.url]);
      localStorage.setItem(RKEY, JSON.stringify(rs.slice(0, 4)));
    }
    navigate({ from: f.url, to: t.url === 'now' ? null : t.url });
  }
  $('tpApply').onclick = apply;
  pane.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') apply(); });

  $('tpBack').onclick = () => { const h = Math.round(SPAN / 2); navigate({ from: P.from - h, to: P.to - h }); };
  $('tpFwd').onclick = () => { const h = Math.round(SPAN / 2); navigate({ from: P.from + h, to: P.to + h }); };
  $('tpOut').onclick = () => { const c = Math.round((P.from + P.to) / 2); navigate({ from: c - SPAN, to: c + SPAN }); };
})();

(async function boot() {
  const useApi = await probeApi();
  const apiUrl = useApi ? location.origin : '';
  document.body.dataset.mode = P.mode;
  document.body.classList.toggle('is-live', LIVE);
  document.getElementById('winLabel').textContent =
    fmtShort(P.from) + ' → ' + fmtShort(P.to) + (useApi ? '' : ' · demo data');
  document.getElementById('cursorTime').textContent = fmtTime(Math.min(P.to, NOW));

  const common = {
    site: P.site ? P.site.join(',') : '',
    from: P.from, to: P.to,
    fit: P.fit, apiUrl, apiKey: P.key,
    tagFilter: P.tags, hideEmpty: P.hideEmpty,
    annotationLanes: P.annLanes,
    headerMode: P.header,
  };

  // site chips: distinct sites from the registry (or the demo set)
  try {
    const sites = useApi
      ? [...new Set((await (await fetch(new URL('/sources', location.origin), AUTHH)).json()).map(k => k.site))].sort()
      : ['site-a', 'site-b'];
    document.getElementById('siteChips').innerHTML =
      sites.map(s => `<span class="chip ${!P.site || P.site.includes(s) ? 'on' : ''}" data-site="${s}">${s}</span>`).join('');
    document.getElementById('siteChips').addEventListener('click', e => {
      const s = e.target.dataset.site;
      if (!s) return;
      let sel = P.site ? [...P.site] : [...sites];
      sel = sel.includes(s) ? sel.filter(x => x !== s) : [...sel, s];
      if (!sel.length) sel = [s];
      navigate({ site: sel.length === sites.length ? null : sel.join(',') });
    });
  } catch { /* chips are best-effort */ }

  for (const btn of document.querySelectorAll('#modeSeg button')) {
    btn.classList.toggle('on', btn.dataset.mode === P.mode);
    btn.onclick = () => navigate({ mode: btn.dataset.mode === 'both' ? null : btn.dataset.mode });
  }
  for (const btn of document.querySelectorAll('#fitSeg button')) {
    btn.classList.toggle('on', btn.dataset.fit === P.fit);
    btn.onclick = () => navigate({ fit: btn.dataset.fit === 'fit' ? null : btn.dataset.fit });
  }

  // mounts + within-page cursor sync (timeline hover drives the grid)
  let grid = null, timeline = null;
  const mountAll = () => {
    if (grid) grid.destroy();
    if (timeline) timeline.destroy();
    grid = P.mode !== 'timeline'
      ? VTCore.mountGrid(document.getElementById('gridMount'), { ...common })
      : null;
    timeline = P.mode !== 'grid'
      ? VTCore.mountTimeline(document.getElementById('timelineMount'), {
          ...common,
          onZoom: (from, to) => navigate({ from, to }),
          onCursor: t => { document.getElementById('cursorTime').textContent = fmtTime(t); },
          onHover: t => { if (grid) grid.setExternalCursor(t); },
          onHoverClear: () => { if (grid) grid.clearExternal(); },
        })
      : null;
  };
  mountAll();

  let rt = null;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(mountAll, 300);
  });
})();
</script>
</body>
</html>
