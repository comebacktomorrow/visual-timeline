# Advisories accepted by CI's advisory gate (.github/scripts/audit-gate.mjs,
# run by the project checks), which fails on any high or critical advisory in
# package-lock.json not listed here. Keep every entry dated: when ignoreUntil
# passes, the advisory fails the gate again and has to be looked at afresh.
#
# The catalog's plugin validator does NOT read this file: since 0.49.16 it
# scans with its own configuration ("osv-scanner.toml is ignored"), so an
# advisory accepted here still fails a submission. See
# docs/UPSTREAM-UPDATES.md, "Security gate".
#
# No advisories are accepted at the moment. (braces, CVE-2026-93687, was
# accepted until create-plugin 7.13.0 dropped it from the scaffold.)
